name: YouTube uploader

# Posts episodes to YouTube with no manual step (see engine/youtube_upload.py and channel/YOUTUBE_SETUP.md).
# Runs after every push that adds or changes an episode, and every hour to publish / confirm / measure.
on:
  push:
    branches: [main]
    paths: ['episodes/**/episode.json', 'videos/**', 'channel/youtube.json']
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be posted, change nothing)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: youtube-uploader
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q google-api-python-client google-auth
      - name: Post / schedule / confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          git config user.name "India in Numbers uploader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 engine/youtube_upload.py ${{ inputs.dry_run && '--dry-run' || '' }}
